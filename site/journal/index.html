<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>예비입양 10일 일지</title>
<meta name="description" content="예비입양 기간, 오늘 하루를 기록하고 공유 카드로 남겨요. 기록은 내 폰에만 저장됩니다.">
<style>
  :root {
    --bg:#FAF8F3; --surface:#fff; --ink:#262219; --ink2:#6E6656; --ink3:#97906F;
    --accent:#2E6B58; --accent-strong:#245546; --accent-soft:#E3EEE8;
    --limit:#A06B22; --limit-soft:#F5EBDA; --line:#E6E1D4;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-size:15px; line-height:1.65;
         font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:28px 16px 64px; }
  h1 { font-size:23px; margin:0 0 4px; }
  .sub { color:var(--ink2); font-size:13.5px; margin:0 0 18px; }
  .name-row { display:flex; gap:8px; margin-bottom:14px; }
  input[type=text] { font:inherit; flex:1; padding:10px 12px; border:1px solid var(--line);
                     border-radius:8px; background:var(--surface); color:var(--ink); }
  .days { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px; }
  .day { width:40px; height:40px; border-radius:10px; border:1px solid var(--line); background:var(--surface);
         font:inherit; cursor:pointer; color:var(--ink2); position:relative; }
  .day.on { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
  .day.done::after { content:""; position:absolute; right:4px; top:4px; width:6px; height:6px;
                     border-radius:50%; background:var(--limit); }
  .q { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px; }
  .q h3 { font-size:14px; margin:0 0 8px; }
  .opts { display:flex; gap:6px; flex-wrap:wrap; }
  .opt { font-size:13px; padding:7px 12px; border-radius:999px; border:1px solid var(--line);
         background:var(--bg); cursor:pointer; user-select:none; color:var(--ink2); }
  .opt.on { background:var(--accent-soft); border-color:var(--accent); color:var(--accent-strong); font-weight:700; }
  .opt.warn.on { background:var(--limit-soft); border-color:var(--limit); color:var(--limit); }
  textarea { font:inherit; width:100%; min-height:64px; padding:10px 12px; border:1px solid var(--line);
             border-radius:8px; background:var(--surface); color:var(--ink); resize:vertical; }
  .caution { background:var(--limit-soft); border-radius:10px; padding:12px 16px; font-size:12.5px;
             color:var(--ink2); margin:14px 0; line-height:1.7; }
  .caution b { color:var(--limit); }
  .btns { display:flex; gap:8px; margin-top:16px; }
  button.main { flex:1; font:inherit; font-weight:700; padding:13px; border-radius:10px; border:0;
                background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { font:inherit; padding:13px 16px; border-radius:10px; border:1px solid var(--line);
                 background:var(--surface); color:var(--ink2); cursor:pointer; }
  canvas { display:none; }
  footer { margin-top:32px; border-top:1px solid var(--line); padding-top:14px; font-size:12px;
           color:var(--ink3); line-height:1.7; }
</style>
</head>
<body>
<div class="wrap">
  <h1>예비입양 10일 일지 📝</h1>
  <p class="sub">하루 1분, 오늘의 아이를 기록하세요. 기록은 <b>내 기기에만</b> 저장되고,
  카드로 만들어 인스타에 남길 수 있어요.</p>

  <div class="name-row">
    <input type="text" id="dogName" placeholder="아이 이름 (예: 콩이)" maxlength="10">
  </div>
  <div class="days" id="days"></div>

  <div id="questions"></div>

  <div class="q">
    <h3>오늘 한 줄</h3>
    <textarea id="memo" placeholder="예: 처음으로 배를 보여줬다!" maxlength="60"></textarea>
  </div>

  <div class="caution">
    이 일지는 <b>판정이 아니라 관찰 기록</b>이에요. 으르렁·입질 같은 신호가 반복되면
    아이가 나쁜 게 아니라 <b>적응에 도움이 필요하다는 뜻</b> — 보호센터에 꼭 상의해 주세요.
  </div>

  <div class="btns">
    <button class="main" id="makeCard">오늘 카드 만들기 🖼️</button>
    <button class="ghost" id="clearDay">오늘 지우기</button>
  </div>

  <canvas id="cv" width="1080" height="1350"></canvas>

  <footer>
    <p>· 기록은 이 브라우저(localStorage)에만 저장됩니다. 서버로 전송되지 않아요.</p>
    <p>· 예비입양제: 입양 전 최대 10일간 보호센터 동물과 미리 살아보는 제도 (2026년 9월 시범 운영 시작).</p>
  </footer>
</div>

<script>
const ITEMS = [
  { k:"meal",  t:"밥과 물",       o:["잘 먹어요","조금 먹어요","거의 안 먹어요"] },
  { k:"potty", t:"배변",          o:["정해진 곳에","실수가 섞여요","아직 어려워요"] },
  { k:"walk",  t:"산책·활동",     o:["신나게!","무난하게","아직 조심스러워요"] },
  { k:"dist",  t:"사람과의 거리", o:["먼저 다가와요","부르면 와요","아직 거리를 둬요"] },
  { k:"alone", t:"혼자 있기",     o:["편안해요","조금 낑낑","많이 불안해해요"] },
  { k:"sign",  t:"오늘의 신호",   o:["없었어요","으르렁·떨림 있었어요","입질 시도가 있었어요"], warn:true },
];
const EMO = ["🟢","🟡","🟠"];
const $ = id => document.getElementById(id);
let day = 1;

function store(){ try { return JSON.parse(localStorage.getItem("mbd-journal")||"{}"); } catch(e){ return {}; } }
function save(data){ try { localStorage.setItem("mbd-journal", JSON.stringify(data)); } catch(e){} }

function buildDays(){
  $('days').innerHTML = "";
  const data = store();
  for (let d=1; d<=10; d++){
    const b = document.createElement('button');
    b.className = 'day' + (d===day?' on':'') + (data['d'+d]?' done':'');
    b.textContent = d; b.onclick = () => { persist(); day=d; load(); };
    $('days').appendChild(b);
  }
}

function buildQuestions(){
  $('questions').innerHTML = ITEMS.map((it,i) => `
    <div class="q"><h3>${it.t}</h3><div class="opts">
      ${it.o.map((o,j)=>`<span class="opt${it.warn&&j>0?' warn':''}" data-i="${i}" data-j="${j}">${o}</span>`).join('')}
    </div></div>`).join('');
  document.querySelectorAll('.opt').forEach(el => el.onclick = () => {
    document.querySelectorAll(`.opt[data-i="${el.dataset.i}"]`).forEach(x=>x.classList.remove('on'));
    el.classList.add('on');
  });
}

function current(){
  const picks = {};
  ITEMS.forEach((it,i) => {
    const on = document.querySelector(`.opt[data-i="${i}"].on`);
    if (on) picks[it.k] = +on.dataset.j;
  });
  return { picks, memo: $('memo').value.trim() };
}

function persist(){
  const data = store();
  const cur = current();
  if (Object.keys(cur.picks).length || cur.memo) data['d'+day] = cur;
  data.name = $('dogName').value.trim();
  save(data);
}

function load(){
  const data = store();
  $('dogName').value = data.name || '';
  const d = data['d'+day] || { picks:{}, memo:'' };
  document.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));
  ITEMS.forEach((it,i) => {
    if (d.picks[it.k] !== undefined) {
      const el = document.querySelector(`.opt[data-i="${i}"][data-j="${d.picks[it.k]}"]`);
      if (el) el.classList.add('on');
    }
  });
  $('memo').value = d.memo || '';
  buildDays();
}

$('clearDay').onclick = () => {
  const data = store(); delete data['d'+day]; save(data); load();
};

function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

$('makeCard').onclick = () => {
  persist();
  const data = store(), d = data['d'+day] || {picks:{},memo:''};
  const name = data.name || '아이';
  const c = $('cv').getContext('2d');
  const F = "'Apple SD Gothic Neo','Malgun Gothic',sans-serif";
  // 바탕
  c.fillStyle = '#FAF8F3'; c.fillRect(0,0,1080,1350);
  c.fillStyle = '#2E6B58'; c.fillRect(0,0,1080,14);
  // 머리
  c.fillStyle = '#97906F'; c.font = `700 34px ${F}`;
  const today = new Date();
  c.fillText(`${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`, 72, 110);
  c.fillStyle = '#262219'; c.font = `700 76px ${F}`;
  c.fillText(`${name}와의 ${day}일차 🐾`, 72, 210);
  c.fillStyle = '#6E6656'; c.font = `400 36px ${F}`;
  c.fillText('예비입양 일지', 72, 268);
  // 항목
  let y = 350;
  ITEMS.forEach(it => {
    const j = d.picks[it.k];
    c.fillStyle = '#FFFFFF'; roundRect(c, 72, y, 936, 96, 20); c.fill();
    c.strokeStyle = '#E6E1D4'; c.lineWidth = 2; roundRect(c, 72, y, 936, 96, 20); c.stroke();
    c.fillStyle = '#262219'; c.font = `700 38px ${F}`; c.fillText(it.t, 104, y+60);
    c.font = `400 38px ${F}`;
    if (j === undefined) { c.fillStyle = '#97906F'; c.textAlign='right'; c.fillText('기록 없음', 976, y+60); }
    else { c.fillStyle = j===0 ? '#245546' : (it.warn||j===2) ? '#A06B22' : '#6E6656';
           c.textAlign='right'; c.fillText(`${EMO[j]} ${it.o[j]}`, 976, y+60); }
    c.textAlign='left';
    y += 116;
  });
  // 메모
  if (d.memo) {
    c.fillStyle = '#E3EEE8'; roundRect(c, 72, y+8, 936, 120, 20); c.fill();
    c.fillStyle = '#245546'; c.font = `700 40px ${F}`;
    c.fillText(`“${d.memo.slice(0,26)}”`, 104, y+82);
  }
  // 푸터
  c.fillStyle = '#97906F'; c.font = `400 30px ${F}`;
  c.fillText('#예비입양일지 #멍BTI #보호견입양', 72, 1290);
  // 다운로드
  const a = document.createElement('a');
  a.download = `예비입양일지_${name}_${day}일차.png`;
  a.href = $('cv').toDataURL('image/png');
  a.click();
};

['dogName','memo'].forEach(id => $(id).addEventListener('change', persist));
buildQuestions(); load();
</script>
</body>
</html>
