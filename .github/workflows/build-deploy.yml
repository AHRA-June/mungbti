name: 수집 후 Pages 배포

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST
  workflow_dispatch:
    inputs:
      attempt:
        description: "재시도 회차 (차단 러너를 만나면 자동 증가)"
        required: false
        default: "1"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # 차단 러너일 때 자기 자신을 재실행하기 위해

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # data.go.kr는 해외 IP 일부 대역을 차단한다 (2026-09-14 실측:
      # 134.33.x 러너는 통과, 64.236.x 러너는 타임아웃).
      # 차단 러너에 걸리면 새 러너(새 IP)로 자기 자신을 다시 던진다.
      - name: 러너 IP가 data.go.kr에 닿는지 확인
        id: probe
        run: |
          echo "runner IP: $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 12 "https://apis.data.go.kr/" || echo 000)
          echo "apis.data.go.kr -> $code"
          if [ "$code" = "000" ]; then
            echo "reachable=no" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: 차단 러너 → 다른 러너로 재도전 (최대 6회)
        if: steps.probe.outputs.reachable == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ github.event.inputs.attempt || '1' }}
        run: |
          if [ "$ATTEMPT" -ge 6 ]; then
            echo "::error::6회 연속 차단 러너 — 오늘 수집 포기 (내일 크론이 다시 시도)"
            exit 1
          fi
          next=$((ATTEMPT + 1))
          gh workflow run build-deploy.yml --ref main -f attempt="$next" -R "${{ github.repository }}"
          echo "차단 IP 러너라 수집 불가 — ${next}회차를 새 러너로 예약했다. 이 실행은 여기서 종료."

      - name: 공고 수집
        if: steps.probe.outputs.reachable == 'yes'
        env:
          ANIMAL_API_KEY: ${{ secrets.ANIMAL_API_KEY }}
        run: python3 collector/collect.py --out site/data

      - name: Pages 아티팩트 업로드
        if: steps.probe.outputs.reachable == 'yes'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 배포
        if: steps.probe.outputs.reachable == 'yes'
        id: deployment
        uses: actions/deploy-pages@v4
