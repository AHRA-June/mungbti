name: 수집 후 Pages 배포

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 공고 수집
        env:
          ANIMAL_API_KEY: ${{ secrets.ANIMAL_API_KEY }}
        run: python3 collector/collect.py --out site/data

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
